name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: atifkhani397
          outputs: |
            output/github-contribution-grid-snake.svg?color_snake=%23ff5ca8&color_dots=%23f5e8f5,%23f3c8df,%23d993bd,%23b56cff,%239b6cff
            output/github-contribution-grid-snake-dark.svg?color_snake=%23ff5ca8&color_dots=%23180b1e,%23502a4f,%23a13d76,%23d55ba8,%239b6cff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_DIR: output
