name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    name: Generate Snake Animation
    runs-on: ubuntu-latest

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: atifkhani397
          outputs: |
            dist/github-snake.svg?color_snake=#ff4fa3&color_dots=#2b0b3f,#6d1a73,#a83288,#d946a8,#ff72c6
            dist/github-snake-dark.svg?color_snake=#ff72c6&color_dots=#1b0628,#4a0d5c,#7b1fa2,#c026d3,#f472b6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish snake to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
          commit_message: "Update contribution snake"