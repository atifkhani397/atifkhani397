<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="190" viewBox="0 0 960 190" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Atif — Software Engineering Student and AI &amp; Agentic AI Developer</title>
  <desc id="desc">Animated dark violet profile introduction with Muhammad Atif's name and rotating focus lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100d1a"/>
      <stop offset="0.55" stop-color="#18112a"/>
      <stop offset="1" stop-color="#29113a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fa3"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="6" y="6" width="948" height="178" rx="28" fill="url(#bg)" stroke="#4b245e" stroke-width="2"/>
  <rect x="34" y="34" width="8" height="122" rx="4" fill="url(#accent)"/>
  <circle cx="860" cy="50" r="90" fill="#8b5cf6" opacity="0.10" filter="url(#glow)"/>
  <circle cx="910" cy="150" r="70" fill="#ff4fa3" opacity="0.08" filter="url(#glow)"/>

  <g transform="translate(84 54)" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 70 V10 L26 42 L52 10 V70"/>
    <path d="M78 70 L104 10 L130 70"/>
    <path d="M88 52 H120"/>
  </g>
  <circle cx="86" cy="58" r="4" fill="#ff4fa3"/>
  <circle cx="216" cy="126" r="4" fill="#8b5cf6"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="280" y="63" fill="#d7b9ff" font-size="13" font-weight="700" letter-spacing="4">HELLO, I’M</text>
    <text x="280" y="108" fill="#ffffff" font-size="40" font-weight="700">Muhammad Atif</text>
    <line x1="280" y1="126" x2="708" y2="126" stroke="url(#accent)" stroke-width="2" opacity="0.75"/>

    <text x="280" y="153" fill="#ff9bc9" font-size="17" font-weight="700" opacity="1">Software Engineering Student<animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;0" keyTimes="0;0.20;0.28;0.60;1"/></text>
    <text x="280" y="153" fill="#ff9bc9" font-size="17" font-weight="700" opacity="0">AI &amp; Agentic AI Developer<animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.20;0.28;0.60;1"/></text>
    <text x="280" y="153" fill="#ff9bc9" font-size="17" font-weight="700" opacity="0">Building Research &amp; Retrieval Systems<animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;0;1;0" keyTimes="0;0.60;0.66;0.86;1"/></text>
    <rect x="710" y="137" width="3" height="21" rx="1.5" fill="#ff4fa3"><animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="1;0;1"/></rect>
  </g>

  <g transform="translate(794 112)" opacity="0.9">
    <circle cx="0" cy="0" r="6" fill="#ff4fa3"/>
    <circle cx="48" cy="-28" r="6" fill="#9f7aea"/>
    <circle cx="48" cy="28" r="6" fill="#9f7aea"/>
    <path d="M6 0 L42 -24 M6 0 L42 24" stroke="#b781d7" stroke-width="2"/>
  </g>
</svg>
