<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">Abstract AI systems identity icon for Muhammad Atif</title>
  <desc id="desc">A dark violet and pink geometric identity card with an MA monogram, connected system nodes, and signal bars.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100d1a"/>
      <stop offset="0.55" stop-color="#18112a"/>
      <stop offset="1" stop-color="#261136"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4fa3"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fa3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="6" y="6" width="948" height="228" rx="28" fill="url(#bg)" stroke="#422253" stroke-width="2"/>
  <circle cx="830" cy="42" r="92" fill="#8b5cf6" opacity="0.08" filter="url(#glow)"/>
  <circle cx="902" cy="198" r="96" fill="#ff4fa3" opacity="0.07" filter="url(#glow)"/>
  <rect x="32" y="30" width="8" height="180" rx="4" fill="url(#accent)"/>

  <g transform="translate(80 48)" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 112 V20 L34 66 L68 20 V112"/>
    <path d="M106 112 L140 20 L174 112"/>
    <path d="M119 78 H161"/>
  </g>
  <circle cx="80" cy="45" r="5" fill="#ff4fa3"/>
  <circle cx="253" cy="160" r="5" fill="#8b5cf6"/>

  <g transform="translate(322 58)">
    <path d="M0 54 L86 8 L172 54 L86 100 Z" fill="#22142f" stroke="#6f3c95" stroke-width="2"/>
    <path d="M0 54 L86 100 L172 54" fill="none" stroke="#9f7aea" stroke-width="2"/>
    <path d="M86 8 V100" fill="none" stroke="#ff79b7" stroke-width="2" stroke-dasharray="6 8"/>
    <circle cx="0" cy="54" r="9" fill="#ff4fa3"/>
    <circle cx="86" cy="8" r="9" fill="#9f7aea"/>
    <circle cx="172" cy="54" r="9" fill="#ff4fa3"/>
    <circle cx="86" cy="100" r="9" fill="#9f7aea"/>
    <path d="M172 54 H250" stroke="url(#line)" stroke-width="3"/>
    <path d="M250 54 V16" stroke="#9f7aea" stroke-width="3" stroke-dasharray="5 7"/>
    <path d="M250 54 V92" stroke="#ff79b7" stroke-width="3" stroke-dasharray="5 7"/>
    <circle cx="250" cy="16" r="7" fill="none" stroke="#9f7aea" stroke-width="3"/>
    <circle cx="250" cy="92" r="7" fill="none" stroke="#ff79b7" stroke-width="3"/>
  </g>

  <g transform="translate(650 50)">
    <rect x="0" y="0" width="218" height="34" rx="17" fill="#251538" stroke="#7540a4"/>
    <rect x="0" y="50" width="154" height="34" rx="17" fill="#251538" stroke="#7540a4"/>
    <rect x="0" y="100" width="188" height="34" rx="17" fill="#251538" stroke="#7540a4"/>
    <rect x="0" y="150" width="112" height="8" rx="4" fill="url(#accent)"/>
    <rect x="124" y="150" width="66" height="8" rx="4" fill="#6f3c95"/>
    <circle cx="244" cy="17" r="6" fill="#ff4fa3"/>
    <circle cx="180" cy="67" r="6" fill="#9f7aea"/>
    <circle cx="214" cy="117" r="6" fill="#ff4fa3"/>
  </g>
</svg>
