<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 220" width="500" height="220">
  <defs>
    <linearGradient id="statBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#2d1b4e"/>
    </linearGradient>
    <linearGradient id="statGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b9d"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="statGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="500" height="220" rx="16" fill="url(#statBg)" stroke="rgba(255,107,157,0.2)" stroke-width="1"/>

  <!-- Rank Ring -->
  <g transform="translate(90, 110)">
    <circle r="55" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>
    <circle r="55" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="345" stroke-dashoffset="345" transform="rotate(-90)">
      <animate attributeName="stroke-dashoffset" from="345" to="52" dur="1.5s" fill="freeze" begin="0.3s"/>
    </circle>
    <text x="0" y="-5" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="28" fill="#fff" font-weight="bold">A+</text>
    <text x="0" y="18" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#888">RANK</text>
  </g>

  <!-- Stat Rows -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.6s" dur="0.5s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="20,0; 0,0" begin="0.6s" dur="0.5s" fill="freeze"/>

    <!-- Commits -->
    <text x="180" y="65" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#888">Total Commits</text>
    <text x="460" y="65" text-anchor="end" font-family="'Segoe UI',system-ui,sans-serif" font-size="18" fill="#fff" font-weight="bold">847</text>
    <rect x="180" y="72" width="280" height="4" rx="2" fill="rgba(255,255,255,0.06)"/>
    <rect x="180" y="72" width="0" height="4" rx="2" fill="url(#statGrad)">
      <animate attributeName="width" from="0" to="240" begin="0.8s" dur="1s" fill="freeze"/>
    </rect>

    <!-- PRs -->
    <text x="180" y="105" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#888">Pull Requests</text>
    <text x="460" y="105" text-anchor="end" font-family="'Segoe UI',system-ui,sans-serif" font-size="18" fill="#fff" font-weight="bold">132</text>
    <rect x="180" y="112" width="280" height="4" rx="2" fill="rgba(255,255,255,0.06)"/>
    <rect x="180" y="112" width="0" height="4" rx="2" fill="url(#statGrad)">
      <animate attributeName="width" from="0" to="180" begin="1.0s" dur="1s" fill="freeze"/>
    </rect>

    <!-- Issues -->
    <text x="180" y="145" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#888">Issues Opened</text>
    <text x="460" y="145" text-anchor="end" font-family="'Segoe UI',system-ui,sans-serif" font-size="18" fill="#fff" font-weight="bold">56</text>
    <rect x="180" y="152" width="280" height="4" rx="2" fill="rgba(255,255,255,0.06)"/>
    <rect x="180" y="152" width="0" height="4" rx="2" fill="url(#statGrad)">
      <animate attributeName="width" from="0" to="120" begin="1.2s" dur="1s" fill="freeze"/>
    </rect>

    <!-- Stars -->
    <text x="180" y="185" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#888">Stars Earned</text>
    <text x="460" y="185" text-anchor="end" font-family="'Segoe UI',system-ui,sans-serif" font-size="18" fill="#fff" font-weight="bold">24</text>
    <rect x="180" y="192" width="280" height="4" rx="2" fill="rgba(255,255,255,0.06)"/>
    <rect x="180" y="192" width="0" height="4" rx="2" fill="url(#statGrad)">
      <animate attributeName="width" from="0" to="90" begin="1.4s" dur="1s" fill="freeze"/>
    </rect>
  </g>
</svg>