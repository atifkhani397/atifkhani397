<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300">
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#ff5ca8"/><stop offset="1" stop-color="#9b6cff"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.s{font-family:Inter,system-ui,sans-serif}@keyframes ring{from{stroke-dashoffset:420}to{stroke-dashoffset:105}}@keyframes row{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}</style></defs>
<rect width="820" height="300" rx="28" fill="#140b1c" stroke="#ff6cae44"/>
