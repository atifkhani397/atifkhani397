<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" role="img" aria-labelledby="title desc">
  <title id="title">Muhammad Atif GitHub statistics</title>
  <desc id="desc">Rounded GitHub statistics card showing 167 total contributions, 4 public repositories, 6 followers, and 9 following.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100d1a"/>
      <stop offset="0.58" stop-color="#18112a"/>
      <stop offset="1" stop-color="#29113a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4fa3"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="number" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9bc9"/>
      <stop offset="1" stop-color="#b99cff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="6" y="6" width="948" height="318" rx="30" fill="url(#bg)" stroke="#4b245e" stroke-width="2"/>
  <circle cx="860" cy="38" r="120" fill="#8b5cf6" opacity="0.08" filter="url(#glow)"/>
  <circle cx="930" cy="292" r="120" fill="#ff4fa3" opacity="0.06" filter="url(#glow)"/>
  <rect x="34" y="32" width="8" height="266" rx="4" fill="url(#accent)"/>

  <g transform="translate(70 38)" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="28" r="24"/>
    <path d="M15 30 L28 16 L41 30"/>
    <path d="M20 37 H36"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="145" y="51" fill="#d7b9ff" font-size="12" font-weight="700" letter-spacing="3">PROFILE SNAPSHOT</text>
    <text x="145" y="80" fill="#ffffff" font-size="24" font-weight="700">GitHub Stats</text>
    <text x="758" y="63" fill="#ff9bc9" font-size="12" font-weight="700" letter-spacing="2">ATIFKHANI397</text>
  </g>

  <rect x="70" y="104" width="820" height="88" rx="22" fill="#211334" stroke="#7540a4" stroke-width="2"/>
  <rect x="70" y="104" width="8" height="88" rx="4" fill="url(#accent)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="104" y="138" fill="#d7b9ff" font-size="12" font-weight="700" letter-spacing="2.5">TOTAL CONTRIBUTIONS</text>
    <text x="104" y="175" fill="url(#number)" font-size="34" font-weight="700">167</text>
    <text x="190" y="171" fill="#bca8c8" font-size="14">contributions in the last year</text>
  </g>
  <g transform="translate(762 129)" opacity="0.9">
    <circle cx="0" cy="22" r="7" fill="#ff4fa3"/>
    <circle cx="36" cy="0" r="7" fill="#9f7aea"/>
    <circle cx="72" cy="22" r="7" fill="#ff4fa3"/>
    <path d="M7 19 L29 4 M43 4 L65 19" stroke="#b781d7" stroke-width="3"/>
  </g>

  <g transform="translate(70 218)" font-family="Arial, Helvetica, sans-serif">
    <g>
      <rect x="0" y="0" width="250" height="72" rx="18" fill="#1d122b" stroke="#5a3472"/>
      <text x="22" y="28" fill="#bca8c8" font-size="11" font-weight="700" letter-spacing="1.5">PUBLIC REPOSITORIES</text>
      <text x="22" y="58" fill="#ffffff" font-size="25" font-weight="700">4</text>
    </g>
    <g transform="translate(270 0)">
      <rect x="0" y="0" width="250" height="72" rx="18" fill="#1d122b" stroke="#5a3472"/>
      <text x="22" y="28" fill="#bca8c8" font-size="11" font-weight="700" letter-spacing="1.5">FOLLOWERS</text>
      <text x="22" y="58" fill="#ffffff" font-size="25" font-weight="700">6</text>
    </g>
    <g transform="translate(540 0)">
      <rect x="0" y="0" width="250" height="72" rx="18" fill="#1d122b" stroke="#5a3472"/>
      <text x="22" y="28" fill="#bca8c8" font-size="11" font-weight="700" letter-spacing="1.5">FOLLOWING</text>
      <text x="22" y="58" fill="#ffffff" font-size="25" font-weight="700">9</text>
    </g>
  </g>
</svg>
