<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="500" height="280">
  <defs>
    <linearGradient id="langBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#2d1b4e"/>
    </linearGradient>
    <linearGradient id="pyGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ff6b9d"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
    <linearGradient id="tsGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#c084fc"/><stop offset="100%" stop-color="#a855f7"/></linearGradient>
    <linearGradient id="javaGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#7c3aed"/></linearGradient>
    <linearGradient id="htmlGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ff6b9d"/><stop offset="100%" stop-color="#f43f5e"/></linearGradient>
    <linearGradient id="sqlGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#c084fc"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
  </defs>

  <rect width="500" height="280" rx="16" fill="url(#langBg)" stroke="rgba(255,107,157,0.2)" stroke-width="1"/>
  <text x="30" y="40" font-family="'Segoe UI',system-ui,sans-serif" font-size="16" fill="#fff" font-weight="bold">Most Used Languages</text>

  <!-- Python 45% -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.4s" fill="freeze"/>
    <text x="30" y="80" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#d0d0d0">Python</text>
    <text x="460" y="80" text-anchor="end" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#fff" font-weight="bold">45%</text>
    <rect x="30" y="88" width="430" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
    <rect x="30" y="88" width="0" height="10" rx="5" fill="url(#pyGrad)">
      <animate attributeName="width" from="0" to="193" begin="0.5s" dur="1.2s" fill="freeze"/>
    </rect>
  </g>

  <!-- TypeScript 22% -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.4s" fill="freeze"/>
    <text x="30" y="125" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#d0d0d0">TypeScript</text>
    <text x="460" y="125" text-anchor="end" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#fff" font-weight="bold">22%</text>
    <rect x="30" y="133" width="430" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
    <rect x="30" y="133" width="0" height="10" rx="5" fill="url(#tsGrad)">
      <animate attributeName="width" from="0" to="94" begin="0.7s" dur="1.2s" fill="freeze"/>
    </rect>
  </g>

  <!-- Java 15% -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.7s" dur="0.4s" fill="freeze"/>
    <text x="30" y="170" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#d0d0d0">Java</text>
    <text x="460" y="170" text-anchor="end" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#fff" font-weight="bold">15%</text>
    <rect x="30" y="178" width="430" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
    <rect x="30" y="178" width="0" height="10" rx="5" fill="url(#javaGrad)">
      <animate attributeName="width" from="0" to="64" begin="0.9s" dur="1.2s" fill="freeze"/>
    </rect>
  </g>

  <!-- HTML/CSS 12% -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.9s" dur="0.4s" fill="freeze"/>
    <text x="30" y="215" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#d0d0d0">HTML/CSS</text>
    <text x="460" y="215" text-anchor="end" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#fff" font-weight="bold">12%</text>
    <rect x="30" y="223" width="430" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
    <rect x="30" y="223" width="0" height="10" rx="5" fill="url(#htmlGrad)">
      <animate attributeName="width" from="0" to="51" begin="1.1s" dur="1.2s" fill="freeze"/>
    </rect>
  </g>

  <!-- SQL 6% -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="1.1s" dur="0.4s" fill="freeze"/>
    <text x="30" y="260" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#d0d0d0">SQL</text>
    <text x="460" y="260" text-anchor="end" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#fff" font-weight="bold">6%</text>
    <rect x="30" y="268" width="430" height="10" rx="5" fill="rgba(255,255,255,0.06)"/>
    <rect x="30" y="268" width="0" height="10" rx="5" fill="url(#sqlGrad)">
      <animate attributeName="width" from="0" to="25" begin="1.3s" dur="1.2s" fill="freeze"/>
    </rect>
  </g>
</svg>