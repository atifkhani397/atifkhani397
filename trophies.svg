<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="500" height="200">
  <defs>
    <linearGradient id="trophyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#2d1b4e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="45%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="55%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <filter id="trophyGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="500" height="200" rx="16" fill="url(#trophyBg)" stroke="rgba(255,107,157,0.2)" stroke-width="1"/>

  <!-- Shine sweep -->
  <rect width="500" height="200" rx="16" fill="url(#shine)">
    <animateTransform attributeName="transform" type="translate" values="-500,0; 500,0" dur="3s" repeatCount="indefinite" begin="2s"/>
  </rect>

  <!-- Trophy 1: Agentic AI Master -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.2s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" values="0.8;1" begin="0.2s" dur="0.4s" fill="freeze"/>
    <rect x="30" y="30" width="140" height="70" rx="12" fill="rgba(255,107,157,0.08)" stroke="rgba(255,107,157,0.25)" stroke-width="1"/>
    <text x="100" y="55" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#888">Agentic AI</text>
    <text x="100" y="82" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="20" fill="#ff6b9d" font-weight="bold" filter="url(#trophyGlow)">S</text>
  </g>

  <!-- Trophy 2: RAG Expert -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.4s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" values="0.8;1" begin="0.4s" dur="0.4s" fill="freeze"/>
    <rect x="180" y="30" width="140" height="70" rx="12" fill="rgba(192,132,252,0.08)" stroke="rgba(192,132,252,0.25)" stroke-width="1"/>
    <text x="250" y="55" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#888">RAG Systems</text>
    <text x="250" y="82" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="20" fill="#c084fc" font-weight="bold" filter="url(#trophyGlow)">A+</text>
  </g>

  <!-- Trophy 3: Full Stack -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.6s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" values="0.8;1" begin="0.6s" dur="0.4s" fill="freeze"/>
    <rect x="330" y="30" width="140" height="70" rx="12" fill="rgba(168,85,247,0.08)" stroke="rgba(168,85,247,0.25)" stroke-width="1"/>
    <text x="400" y="55" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#888">Full Stack</text>
    <text x="400" y="82" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="20" fill="#a855f7" font-weight="bold" filter="url(#trophyGlow)">A</text>
  </g>

  <!-- Trophy 4: Open Source -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="0.8s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" values="0.8;1" begin="0.8s" dur="0.4s" fill="freeze"/>
    <rect x="30" y="110" width="140" height="70" rx="12" fill="rgba(255,107,157,0.08)" stroke="rgba(255,107,157,0.25)" stroke-width="1"/>
    <text x="100" y="135" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#888">Open Source</text>
    <text x="100" y="162" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="20" fill="#ff6b9d" font-weight="bold" filter="url(#trophyGlow)">B+</text>
  </g>

  <!-- Trophy 5: Problem Solver -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="1.0s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" values="0.8;1" begin="1.0s" dur="0.4s" fill="freeze"/>
    <rect x="180" y="110" width="140" height="70" rx="12" fill="rgba(192,132,252,0.08)" stroke="rgba(192,132,252,0.25)" stroke-width="1"/>
    <text x="250" y="135" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#888">Problem Solver</text>
    <text x="250" y="162" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="20" fill="#c084fc" font-weight="bold" filter="url(#trophyGlow)">A</text>
  </g>

  <!-- Trophy 6: Continuous Learner -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" begin="1.2s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="scale" values="0.8;1" begin="1.2s" dur="0.4s" fill="freeze"/>
    <rect x="330" y="110" width="140" height="70" rx="12" fill="rgba(168,85,247,0.08)" stroke="rgba(168,85,247,0.25)" stroke-width="1"/>
    <text x="400" y="135" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#888">Learner</text>
    <text x="400" y="162" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="20" fill="#a855f7" font-weight="bold" filter="url(#trophyGlow)">S</text>
  </g>
</svg>